name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        otp: ["27.3", "28", "29"]
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: "3.26.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: check-${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
      - run: rebar3 compile
      - run: rebar3 xref
      - run: rebar3 dialyzer
      - run: rebar3 eunit -v -c

  ct:
    runs-on: ubuntu-24.04
    needs: check
    strategy:
      fail-fast: false
      matrix:
        etcd: [v3.5.10, v3.6.5, v3.7.0]
        tls: [false, true]
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          rebar3-version: "3.26.0"
      - uses: extractions/setup-just@v2
      - name: Start a clean etcd cluster with auth
        run: just etcd-up ${{ matrix.etcd }} ${{ matrix.tls }}
      # The case partitioned_member cuts the network of a member with this image, it is skipped
      # if the image is not there.
      - name: Pull the image of the fault tests
        run: docker pull alpine:3.22
      - name: Run the suite
        run: |
          rebar3 eunit -v -c
          if [ "${{ matrix.tls }}" = true ]; then
            ETCDGUN_CT_TLS_CERTS=$PWD/data/ct/certs rebar3 ct -v -c --suite test/etcdgun_tls_SUITE
          else
            rebar3 ct -v -c --suite test/etcdgun_SUITE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: coverdata-${{ matrix.etcd }}-tls-${{ matrix.tls }}
          path: _build/test/cover/*.coverdata
      - name: Logs of the cluster
        if: failure()
        run: COMPOSE_PROJECT_NAME=etcdgun-ct ETCD_DATA_DIR=data/ct docker compose logs --no-color | tail -500
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ct-logs-${{ matrix.etcd }}-tls-${{ matrix.tls }}
          path: _build/test/logs
      - name: Destroy the cluster
        if: always()
        run: just etcd-ct-destroy

  coverage:
    runs-on: ubuntu-24.04
    needs: ct
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          rebar3-version: "3.26.0"
      # One directory for every run, the files of the runs have the same names.
      - uses: actions/download-artifact@v7
        with:
          pattern: coverdata-*
          path: coverdata
      - name: Coverage of all the runs
        run: |
          mkdir -p _build/test/cover
          for f in coverdata/*/*.coverdata; do
            cp "$f" "_build/test/cover/$(basename "$(dirname "$f")")-$(basename "$f")"
          done
          rebar3 cover -v
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: _build/test/cover
